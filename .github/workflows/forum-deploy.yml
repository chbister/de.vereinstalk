# Forum Remote-Deployment: nur Deploy (b03), ohne Build.
#
# Zweck:
# - Löst exakt den gleichen "Deploy (b03)"-Schritt aus wie forum.yml
#   (GHCR-Image pullen + per PROD-Override starten), aber OHNE vorher zu bauen.
# - Nützlich für: Re-Deploy nach Host-Reboot, .env-Fix auf b03, Rollback auf
#   einen älteren Image-Tag, oder manuelles Nachholen eines Deployments.
#
# Trigger (remote):
# - GitHub-UI: Actions -> "forum-deploy" -> "Run workflow"
# - CLI (gh):
#     gh workflow run forum-deploy.yml --ref main -f image_tag=<sha|latest>
#   Beispiel Rollback / Pin auf einen SHA:
#     gh workflow run forum-deploy.yml --ref main -f image_tag=abc1234...
#   Beispiel aktuelles :latest redeployen (Default):
#     gh workflow run forum-deploy.yml --ref main
# - API (curl):
#     curl -X POST \
#       -H "Authorization: Bearer <TOKEN>" \
#       -H "Accept: application/vnd.github+json" \
#       https://api.github.com/repos/chbister/de.vereinstalk/actions/workflows/forum-deploy.yml/dispatches \
#       -d '{"ref":"main","inputs":{"image_tag":"latest"}}'
#
# PROD-Secrets (.env) liegen auf b03 und werden NICHT angefasst, siehe
# Schritt "Pull + Start": --env-file zeigt auf die Host-Datei
# (Default /home/theuser/__dotenv__/env.de.vereinstalk.forum, per Repo-Variablen
# PROD_FORUM_ENV_FILE bzw. PROD_ENV_FILE überschreibbar).

name: forum-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR-Tag für FORUM_IMAGE (Commit-SHA für Pin/Rollback, oder 'latest')"
        required: false
        default: "latest"
        type: string
      ref:
        description: "Checkout-Ref für Compose-Files (Branch/Tag/SHA)"
        required: false
        default: "main"
        type: string

concurrency:
  group: forum-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/vereinstalk-forum

jobs:
  deploy:
    name: Deploy (b03)
    # Forum läuft auf b03 (Runner-Label b03 pinnt den Host).
    runs-on: [self-hosted, production, vereinstalk, b03]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: de.vereinstalk.forum
    steps:
      - name: Checkout (Compose-Files aus Ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull + Start (PROD-Override)
        env:
          FORUM_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ inputs.image_tag }}
          # Stack-spezifische Variable hat Vorrang; PROD_ENV_FILE bleibt als
          # Fallback (backward compat). Default: Forum-Env-File auf b03.
          FORUM_ENV_FILE: ${{ vars.PROD_FORUM_ENV_FILE }}
          ENV_FILE: ${{ vars.PROD_ENV_FILE }}
        run: |
          echo "Deploye Image: $FORUM_IMAGE (Ref: ${{ inputs.ref }})"
          ENV_FILE="${FORUM_ENV_FILE:-$ENV_FILE}"
          ENV_FILE="${ENV_FILE:-/home/theuser/__dotenv__/env.de.vereinstalk.forum}"
          test -f "$ENV_FILE" || { echo "::error::ENV_FILE '$ENV_FILE' fehlt auf dem Host"; exit 1; }
          # Pre-Flight: Pflicht-Keys für die Auto-Installation prüfen (nur Keys,
          # keine Werte loggen). Ohne diese Keys startet der Container mit den
          # Compose-Defaults (FLARUM_AUTO_INSTALL=false) und installiert still
          # NICHT — genau das sah auf PROD nach "wird nicht durchgeführt" aus.
          missing=""
          for key in FLARUM_AUTO_INSTALL FLARUM_URL FLARUM_ADMIN_USER FLARUM_ADMIN_EMAIL FLARUM_ADMIN_PASSWORD MARIADB_PASSWORD MARIADB_ROOT_PASSWORD FORUM_DOMAIN; do
            grep -qE "^${key}=" "$ENV_FILE" || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::ENV_FILE '$ENV_FILE' fehlen Keys:$missing (siehe de.vereinstalk.forum/.env.example)"
            exit 1
          fi
          grep -qE '^FLARUM_AUTO_INSTALL=true' "$ENV_FILE" || echo "::warning::FLARUM_AUTO_INSTALL ist nicht 'true' in $ENV_FILE — Auto-Installation wird übersprungen."
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.prod.yml pull
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.prod.yml up -d
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.prod.yml ps
          # Setup-Ausgang direkt im Job sichtbar machen (Entrypoint loggt nach
          # [flarum], ohne Secrets).
          echo "--- forum logs (setup) ---"
          sleep 15
          docker logs vereinstalk-forum --tail 60 || \
            docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.prod.yml logs forum --tail 60
