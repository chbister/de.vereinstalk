# Forum: Build -> GHCR -> Deploy auf b03.
#
# Trigger:
# - push auf main (z. B. gemergter PR) mit Änderung unter de.vereinstalk.forum/:
#   Image bauen, nach GHCR pushen (:<sha> + :latest), danach auf dem
#   Self-Hosted Runner (b03) per PROD-Override starten.
#   (Die statische Site läuft separat weiter auf b01, siehe site.yml.)
# - pull_request: nur bauen (Validierung), kein Push, kein Deploy.
# - schedule (So 03:00 UTC): Update-Check im aktuellen :latest-Image
#   (OS-Pakete + Composer). Nur wenn Updates anstehen, wird neu gebaut
#   (ohne Layer-Cache, mit frischem Basis-Image) und deployed.
#   Ohne Updates werden Build + Deploy übersprungen ("nur wenn neuer").
#
# PROD-Secrets (.env) liegen auf b03 und werden NICHT angefasst, siehe
# Schritt "Pull + Start": --env-file zeigt auf die Host-Datei
# (Default /home/theuser/__dotenv__/env.de.vereinstalk.forum, per Repo-Variablen
# PROD_FORUM_ENV_FILE bzw. PROD_ENV_FILE überschreibbar).

name: forum

on:
  push:
    branches: [main]
    paths:
      - "de.vereinstalk.forum/**"
      - ".github/workflows/forum.yml"
  pull_request:
    branches: [main]
    paths:
      - "de.vereinstalk.forum/**"
      - ".github/workflows/forum.yml"
  # Wöchentlicher Rebuild (So 03:00 UTC): holt Basis-Image- und
  # Composer-Updates (Flarum, Extensions, Sprachpakete) ins GHCR-Image.
  # Hinweis: `paths`-Filter gelten nur für push/PR, schedule läuft immer.
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: forum-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/vereinstalk-forum

jobs:
  check:
    name: Update-Check
    # Gate nur für schedule relevant: Bei push/PR/dispatch immer bauen.
    # Bei schedule wird im aktuellen :latest-Image geprüft, ob OS- oder
    # Composer-Updates anstehen; nur dann wird neu gebaut + deployed.
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Auf Updates prüfen
        id: decide
        env:
          CURRENT_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:latest
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! docker pull "$CURRENT_IMAGE"; then
            echo "Kein :latest-Image in GHCR -> neu bauen."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          updates=0
          # 1) OS-/Basis-Ebene: upgradable Debian-Pakete im aktuellen Image.
          #    (--entrypoint umgeht den Flarum-Entrypoint, also kein DB-Wait.)
          if docker run --rm --entrypoint bash "$CURRENT_IMAGE" -lc \
            'apt-get update -qq && apt list --upgradable 2>/dev/null | grep -v "Listing..." | grep -q .'; then
            echo "OS-Updates verfügbar."
            updates=1
          else
            echo "Keine OS-Updates."
          fi
          # 2) Composer-Ebene: Flarum-Core, Extensions, Sprachpakete.
          if docker run --rm --entrypoint bash "$CURRENT_IMAGE" -lc \
            'composer outdated --direct --no-interaction 2>/dev/null | grep -q .'; then
            echo "Composer-Updates verfügbar."
            updates=1
          else
            echo "Keine Composer-Updates."
          fi
          if [ "$updates" = "1" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image ist aktuell -> Build + Deploy werden übersprungen."
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build + Push (GHCR)
    needs: check
    if: ${{ needs.check.outputs.rebuild == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + Push
        uses: docker/build-push-action@v6
        with:
          context: ./de.vereinstalk.forum
          # PRs nur bauen (kein Push nach GHCR).
          push: ${{ github.event_name != 'pull_request' }}
          # Basis-Image immer frisch ziehen; bei schedule/dispatch zusätzlich
          # ohne Layer-Cache bauen, damit Composer-Updates (Flarum,
          # Extensions, Sprachpakete) einfließen. Push-Builds bleiben aus
          # Geschwindigkeitsgründen gecached (Erneuerung via schedule).
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (b03)
    needs: build
    # Bei schedule ohne Updates wurde build geskippt -> dann auch kein Deploy.
    if: ${{ github.event_name != 'pull_request' && needs.build.result == 'success' }}
    # Forum läuft auf b03 (Runner-Label b03 pinnt den Host).
    runs-on: [self-hosted, production, vereinstalk, b03]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: de.vereinstalk.forum
    steps:
      - name: Checkout (exakt der gebaute Commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull + Start (PROD-Override)
        env:
          FORUM_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ github.sha }}
          # Stack-spezifische Variable hat Vorrang; PROD_ENV_FILE bleibt als
          # Fallback (backward compat). Default: Forum-Env-File auf b03.
          FORUM_ENV_FILE: ${{ vars.PROD_FORUM_ENV_FILE }}
          ENV_FILE: ${{ vars.PROD_ENV_FILE }}
        run: |
          ENV_FILE="${FORUM_ENV_FILE:-$ENV_FILE}"
          ENV_FILE="${ENV_FILE:-/home/theuser/__dotenv__/env.de.vereinstalk.forum}"
          test -f "$ENV_FILE" || { echo "::error::ENV_FILE '$ENV_FILE' fehlt auf dem Host"; exit 1; }
          # Pre-Flight: Pflicht-Keys für die Auto-Installation prüfen (nur Keys,
          # keine Werte loggen). Ohne diese Keys startet der Container mit den
          # Compose-Defaults (FLARUM_AUTO_INSTALL=false) und installiert still
          # NICHT — genau das sah auf PROD nach "wird nicht durchgeführt" aus.
          missing=""
          for key in FLARUM_AUTO_INSTALL FLARUM_URL FLARUM_ADMIN_USER FLARUM_ADMIN_EMAIL FLARUM_ADMIN_PASSWORD MARIADB_PASSWORD MARIADB_ROOT_PASSWORD FORUM_DOMAIN; do
            grep -qE "^${key}=" "$ENV_FILE" || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::ENV_FILE '$ENV_FILE' fehlen Keys:$missing (siehe de.vereinstalk.forum/.env.example)"
            exit 1
          fi
          grep -qE '^FLARUM_AUTO_INSTALL=true' "$ENV_FILE" || echo "::warning::FLARUM_AUTO_INSTALL ist nicht 'true' in $ENV_FILE — Auto-Installation wird übersprungen."
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.prod.yml pull
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.prod.yml up -d
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.prod.yml ps
          # Setup-Ausgang direkt im Job sichtbar machen (Entrypoint loggt nach
          # [flarum], ohne Secrets).
          echo "--- forum logs (setup) ---"
          sleep 15
          docker logs vereinstalk-forum --tail 60 || \
            docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.prod.yml logs forum --tail 60
