services:
  vereinstalk-static-site:
    build:
      context: .
      dockerfile: Dockerfile
    # Lokal: `docker compose up -d --build` baut das Image.
    # CI/PROD: per SITE_IMAGE auf das GHCR-Image zeigen (Deploy pinnt den SHA).
    image: ${SITE_IMAGE:-ghcr.io/chbister/vereinstalk-site:latest}
    container_name: vereinstalk-static-site
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs:/usr/share/nginx/html:ro
    networks:
      - edge

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:-dev-shared-network}
