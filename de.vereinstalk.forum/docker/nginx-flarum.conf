# Flarum rewrite rules, bereitgestellt als webdevops/php-nginx vhost-Include.
# Quelle: https://github.com/flarum/flarum/blob/2.x/.nginx.conf
# Wird per Dockerfile nach /opt/docker/etc/nginx/vhost.common.d/ kopiert
# und damit automatisch in den Server-Block eingebunden.
# (vgl. https://docs.flarum.org/install/#nginx)

# Hinweis: Das `location /` mit try_files aus Flarums .nginx.conf ist hier
# absichtlich NICHT enthalten — das webdevops-Image liefert bereits
# /opt/docker/etc/nginx/vhost.common.d/10-location-root.conf mit
# identischer Regel (try_files $uri $uri/ /index.php?$query_string),
# ein zweiter `location /`-Block würde Nginx mit "duplicate location" scheitern lassen.

# Falls Flarum ohne `public`-Verzeichnis betrieben wird, folgende Zeilen
# einkommentieren, um sensible Ressourcen zu schützen:
# location ~* ^/(\.git|composer\.(json|lock)|auth\.json|config\.php|flarum|storage|vendor) {
#   deny all;
#   return 404;
# }

# Expire-Regeln für statische Inhalte (Best Practice nach H5BP)
location ~* \.(?:manifest|appcache|html?|xml|json)$ {
  add_header Cache-Control "max-age=0";
}

location ~* \.(?:rss|atom)$ {
  add_header Cache-Control "max-age=3600";
}

location ~* \.(?:jpg|jpeg|gif|png|webp|ico|cur|gz|svg|mp4|ogg|ogv|webm|htc)$ {
  add_header Cache-Control "max-age=2592000";
  access_log off;
}

location ~* \.(?:css|js)$ {
  add_header Cache-Control "max-age=31536000";
  access_log off;
}

location ~* \.(?:ttf|ttc|otf|eot|woff|woff2)$ {
  add_header Cache-Control "max-age=2592000";
  access_log off;
}

# Gzip-Kompression (gzip-Direktiven sind auch im server-Kontext gültig)
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/javascript
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;
